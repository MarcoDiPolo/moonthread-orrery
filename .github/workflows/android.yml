name: Build the PICO APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the Android platform and build tools
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Test puzzle rules and compile the application
        run: bash gradlew --console=plain :app:testDebugUnitTest :app:assembleDebug
      - name: Verify the signed APK and package identifier
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose "$apk"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/moonthread-package.txt"
          grep -F "package: name='studio.moonthread.orrery'" "$RUNNER_TEMP/moonthread-package.txt"
          cp "$apk" moonthread-orrery.apk
          sha256sum moonthread-orrery.apk > moonthread-orrery.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: moonthread-orrery-apk
          path: |
            moonthread-orrery.apk
            moonthread-orrery.apk.sha256
